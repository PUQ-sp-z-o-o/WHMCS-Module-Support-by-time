<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a4e4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="250" fill="url(#bg)" rx="8"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="440" height="4" fill="url(#accent)" rx="2"/>

  <!-- Clock + ticket icon -->
  <g transform="translate(40, 60)">
    <!-- Clock face -->
    <circle cx="40" cy="40" r="34" fill="none" stroke="#00a4e4" stroke-width="2.5"/>
    <!-- Hour markers -->
    <line x1="40" y1="10" x2="40" y2="16" stroke="#00a4e4" stroke-width="2"/>
    <line x1="40" y1="64" x2="40" y2="70" stroke="#00a4e4" stroke-width="2"/>
    <line x1="10" y1="40" x2="16" y2="40" stroke="#00a4e4" stroke-width="2"/>
    <line x1="64" y1="40" x2="70" y2="40" stroke="#00a4e4" stroke-width="2"/>
    <!-- Hour hand -->
    <line x1="40" y1="40" x2="40" y2="22" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="40" y1="40" x2="58" y2="40" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="40" cy="40" r="2.5" fill="#0082c9"/>
  </g>

  <!-- WHMCS badge -->
  <g transform="translate(140, 68)">
    <rect x="0" y="0" width="85" height="32" rx="6" fill="#00a4e4" opacity="0.15" stroke="#00a4e4" stroke-width="1.5"/>
    <text x="42" y="21" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle">WHMCS</text>
  </g>

  <!-- Module title -->
  <text x="240" y="75" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="start">Support</text>
  <text x="240" y="108" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="start">by Time</text>

  <!-- Subtitle -->
  <text x="240" y="135" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">WHMCS Server Module</text>

  <!-- Divider -->
  <rect x="240" y="148" width="60" height="2" fill="#0082c9" rx="1"/>

  <!-- Description -->
  <text x="240" y="172" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Time-based paid technical support</text>
  <text x="240" y="188" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">with automatic monthly billing</text>

  <!-- PUQ Cloud branding -->
  <g transform="translate(30, 210)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0082c9">PUQ</text>
    <text x="55" y="15" font-family="Arial, sans-serif" font-size="12" fill="#64748b">cloud</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(370, 218)">
    <rect x="0" y="0" width="45" height="20" rx="4" fill="#0082c9" opacity="0.2" stroke="#0082c9" stroke-width="1"/>
    <text x="22" y="14" font-family="Arial, sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">v3.0</text>
  </g>
</svg>
